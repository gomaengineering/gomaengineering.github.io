<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Goma Engineering Consultation</title>
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f8f9fa;
            color: #28231d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .logo {
            max-width: 200px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #2a4290;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            max-width: 600px;
        }
        .btn {
            display: inline-block;
            background-color: #2a4290;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #033f57;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #e6e6e6;
            }
            h1 {
                color: #4a66c7;
            }
            .btn {
                background-color: #4a66c7;
            }
            .btn:hover {
                background-color: #5a7bc7;
            }
        }
    </style>
</head>
<body>
    <img src="Assets/goma-engineering-logo.png" alt="Goma Engineering Logo" class="logo">
    <h1>You are currently offline</h1>
    <p>It seems you are not connected to the internet. Please check your connection and try again.</p>
    <a href="/" class="btn">Try Again</a>
</body>
</html>
